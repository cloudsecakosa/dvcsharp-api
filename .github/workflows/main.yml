name: Snyk Security Scan (Windows Runner)

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

jobs:
  snyk_security_scan:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        run: |
          echo "Checking .NET SDK installation..."
          if (!(Get-Command dotnet -ErrorAction SilentlyContinue)) {
            echo "Installing .NET SDK..."
            choco install dotnet-sdk -y
          }
          dotnet --version
        shell: powershell

      - name: Install Snyk CLI
        run: |
          if (!(Test-Path "C:\snyk\snyk.exe")) {
            mkdir C:\snyk -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri "https://static.snyk.io/cli/latest/snyk-win.exe" -OutFile "C:\snyk\snyk.exe"
          }
          & C:\snyk\snyk.exe --version
        shell: powershell

      - name: Install jq (for JSON parsing)
        run: |
          if (!(Test-Path "C:\jq\jq.exe")) {
            mkdir C:\jq -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri "https://github.com/stedolan/jq/releases/download/jq-1.6/jq-win64.exe" -OutFile "C:\jq\jq.exe"
          }
          & C:\jq\jq.exe --version
        shell: powershell

      - name: Restore .NET Dependencies
        run: |
          echo "Restoring .NET dependencies..."
          dotnet restore
        shell: powershell

      - name: Run Snyk Code Scan (Static Analysis)
        id: snyk_code_scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "Running Snyk Code scan..."
          C:\snyk\snyk.exe code test --all-projects --json > snyk-code-report.json || echo "Vulnerabilities detected but continuing..."
        shell: cmd

      - name: Parse Snyk Code Scan Results
        id: snyk_parse_results
        run: |
          $comment = "## 🔍 Snyk Security Scan Results`n`n"
          $reportPath = "snyk-code-report.json"

          if (Test-Path $reportPath) {
              $report = Get-Content $reportPath -Raw | ConvertFrom-Json
              $vulnerabilities = $report.runs[0].results

              if ($vulnerabilities.Count -gt 0) {
                  $comment += "**⚠️ Found $($vulnerabilities.Count) vulnerabilities in this PR.**`n`n"

                  foreach ($vuln in $vulnerabilities) {
                      $ruleId = $vuln.ruleId
                      $description = $vuln.message.text
                      $filePath = $vuln.locations[0].physicalLocation.artifactLocation.uri
                      $startLine = $vuln.locations[0].physicalLocation.region.startLine
                      $endLine = $vuln.locations[0].physicalLocation.region.endLine

                      $comment += "- **$ruleId** in `$filePath` (Lines $startLine-$endLine)`n"
                      $comment += "  - **Description**: $description`n`n"
                  }
              } else {
                  $comment += "✅ No vulnerabilities found in code analysis.`n"
              }
          } else {
              $comment += "❌ No Snyk report found. Scan may have failed."
          }

          Write-Output "body<<EOF" >> $env:GITHUB_OUTPUT
          Write-Output $comment >> $env:GITHUB_OUTPUT
          Write-Output "EOF" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Post PR Comment with Vulnerabilities
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `${{ steps.snyk_parse_results.outputs.body }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });

      - name: Upload Scan Reports
        uses: actions/upload-artifact@v4
        with:
          name: snyk-scan-reports
          path: snyk-code-report.json
        if: always()
